<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m</title>
  <link rel="icon" href="https://mq6.pw/moon.png">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://mq6.pw/site.png">
  <link rel="stylesheet" href="./css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <main class="container">
    <div class="card profile-card">
      <img src="https://api.lanyard.rest/1442791669220249631.png" class="avatar" alt="m's avatar">
      <div class="profile-info">
        <h1 class="name">m</h1>
        <p class="bio">i know too much</p>
      </div>
    </div>

    <div class="card song-card">
      <img class="album-art" src="" alt="album art">
      <div class="track-info">
        <span class="track-name">—</span>
        <span class="track-artist">—</span>
      </div>
    </div>

    <nav class="card links-card">
      <a href="https://www.last.fm/user/QM" class="link-btn" target="_blank" rel="noopener noreferrer">last.fm</a>
      <a href="https://www.roblox.com/users/5360735/profile" class="link-btn" target="_blank" rel="noopener noreferrer">roblox</a>
      <a href="https://api.vaultcord.com/webhooks/public-lookup/1442791669220249631" class="link-btn" target="_blank" rel="noopener noreferrer">discord</a>
      <a href="mailto:pew@outlook.com" class="link-btn">email</a>
    </nav>
  </main>

  <script>
    async function loadTrack() {
      try {
        const res = await fetch('/api/now-playing');
        if (!res.ok) return;
        const track = await res.json();

        const art = document.querySelector('.album-art');
        const name = document.querySelector('.track-name');
        const artist = document.querySelector('.track-artist');

        if (track.song) {
          name.textContent = track.song;
          artist.textContent = track.artist;
          if (track.cover_url) art.src = track.cover_url;
        }
      } catch (_) {}
    }

    loadTrack();
    setInterval(loadTrack, 700);
  </script>

</body>
</html>
